
{% extends 'blog/base.html' %}

{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #e0eafc, #cfdef3);
        min-height: 100vh;
    }

    .register-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .register-card {
        width: 100%;
        max-width: 450px;
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    .register-card {
    color: #1e293b;
    }

    .register-card .form-label {
        color: #334155 ;
        display: block;
        font-weight: 600;
    }

    .register-title {
        color: #1e293b;
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 10px;
    }

    .register-subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-control {
        padding: 13px 15px;
        border-radius: 9px;
        border: 1px solid #dbe2ea;
        background-color: #f8fafc;
        font-size: 15px;
    }

    .form-control:focus {
        background-color: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .register-btn {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 9px;
        padding: 13px;
        font-weight: 600;
        font-size: 16px;
        transition: 0.3s;
    }

    .register-btn:hover {
        background: #1d4ed8;
        color: white;
        transform: translateY(-2px);
    }

    .login-link {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }

    .login-link:hover {
        text-decoration: underline;
    }
</style>

<div class="register-container">

    <div class="register-card">

        <div class="text-center">
            <h2 class="register-title">Create an Account</h2>

            <p class="register-subtitle">
                Join Scripto and start sharing your stories.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text"
                       class="form-control"
                       name="uname"
                       placeholder="Enter your name"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email"
                       class="form-control"
                       name="uemail"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password"
                       class="form-control"
                       name="upassword"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit" class="btn register-btn w-100">
                Create Account
            </button>

        </form>

        <div class="text-center mt-4">
            <span class="text-secondary">
                Already have an account?
            </span>

            <a href="loginn" class="login-link">
                Login here
            </a>
        </div>

    </div>

</div>

{% endblock %}
